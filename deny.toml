[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "aws-lc-rs only" },
    { crate = "openssl-sys", reason = "aws-lc-rs only" },
    { crate = "ring", reason = "aws-lc-rs only" },
    { crate = "rsa", reason = "Marvin timing side channel, no fix" },
    { crate = "serde_stacker", reason = "unbounded JSON depth" },
    { crate = "fancy-regex", reason = "backtracking regular expressions" },
    { crate = "pcre2", reason = "backtracking regular expressions" },
    { crate = "pcre2-sys", reason = "backtracking regular expressions" },
    { crate = "onig", reason = "backtracking regular expressions" },
    { crate = "onig_sys", reason = "backtracking regular expressions" },
]

[[bans.features]]
crate = "serde_json"
deny = ["unbounded_depth"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
