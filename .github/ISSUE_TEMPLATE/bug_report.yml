name: Bug report
description: Report a schema, vector, reader or SDK behaviour that does not match the contract.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Use private reporting as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Name the schema, table or vector that defines the expected behaviour, if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
