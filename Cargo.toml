[workspace]
resolver = "3"
members = ["export/reader", "tools/vectors"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/e-suiss/one-open"

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
toml = { version = "1.1.6", default-features = false }
boon = { version = "=0.6.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"

[profile.release]
overflow-checks = true
